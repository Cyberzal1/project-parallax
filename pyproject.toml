[project]
name = "project-parallax"
version = "0.8.0"
description = "Adversarial Cloud Architecture & Split-Brain Patch Verification Engine for GCP"
readme = "README.md"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["hcl2", "hcl2.*", "networkx", "networkx.*"]
ignore_missing_imports = true
implicit_reexport = true
