rules:
  - rule_id: "SECOPS_GCP_001"
    severity: "HIGH"
    description: "Detects workspace document secret access via Vertex AI Agent."
    match:
      event_type: "SECRET_MANAGER_ACCESS"
      tool_name: "read_workspace_context"

  - rule_id: "SECOPS_GCP_002"
    severity: "CRITICAL"
    description: "Detects privilege escalation attempts against prod-* secrets."
    match:
      event_type: "SECRET_MANAGER_ACCESS"
      tool_name: "read_workspace_context"
      target_secret_prefix: "prod-"
